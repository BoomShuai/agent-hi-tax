protocol:
  deviations:
    - "WorkBuddy is a desktop IDE: terminal commands prepared and verified empty directories, while folder selection, mode confirmation, and prompt submission were manual GUI actions."
    - "The fixed requested model Auto routed R1 and R2 to glm-5.2 and R3 to deepseek-v4-flash; actual model is therefore an attempt result, not a fixed underlying-model scenario variable."
    - "The UI label 日常办公 and native SQLite mode craft describe different product layers and are both retained."
    - "R2 exposed the contributor's Git identity and R3 interpreted the workspace basename; public evidence redacts the identity while documenting both as global-context observations."
    - "Subscription plan and account-level quota were not captured; exact per-attempt WorkBuddy credit remains verified."
    - "The external watcher is an observer, not a WorkBuddy hook; it reads completed records and makes no model call."
    - "The watcher cross-checked SQLite immediately after each completion; later GUI workspace switching can soft-delete the prior session and remove its session_usage row while leaving JSONL intact."
  notes: "This package measures the WorkBuddy Auto routing harness, not a controlled single-model benchmark."
